<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#1d1d1d"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#f28c1b"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="18" fill="url(#bg)" stroke="#4a4a4a" stroke-width="2"/>
  <!-- Raio: o áudio. Encostado à esquerda para o "+" caber ao lado. -->
  <path d="M62 24 L28 74 h18 l-7 34 34-48 h-18 z" fill="url(#bolt)"/>
  <!-- "+": a soma do raio com a amplificação. -->
  <g fill="#ffd79a">
    <rect x="83" y="27" width="11" height="34" rx="5.5"/>
    <rect x="71.5" y="38.5" width="34" height="11" rx="5.5"/>
  </g>
</svg>
